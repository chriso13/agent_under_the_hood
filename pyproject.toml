[project]
name = "agent-under-the-hood"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chriso13", email = "jeancharles.jeanchrisner@yahoo.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
agent-under-the-hood = "agent_under_the_hood:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
